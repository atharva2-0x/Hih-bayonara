[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doubleblind"
version = "0.1.0"
description = "Clinical-trial-grade isolation for adversarial AI safety testing (Hack in Hills '26, Track 04)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
doubleblind = "doubleblind.__main__:main"
dbverify = "doubleblind.verifier.cli:main"

[tool.setuptools.packages.find]
include = ["doubleblind*"]

[tool.setuptools.package-data]
doubleblind = ["authority/policy.json", "drill/flow_matrix.json", "zones/blue/*.json", "warroom/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
